<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FrehAiIgs Local</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="logo">Freh<span>Ai</span>Igs</div>
      <button id="new-chat" class="new-chat-btn">+ New Chat</button>
      
      <div class="history-section">
        <div class="history-title">Recent Chats</div>
        <div id="chat-list" class="chat-list"></div>
      </div>

      <div class="sidebar-bottom">
        <button id="open-settings" class="sidebar-btn">
          <span id="settings-text">⚙️ Settings</span>
          <span id="construction-badge" class="badge-construction">Under Construction</span>
        </button>
      </div>
    </div>

    <!-- Main Chat Area -->
    <div class="main">
      <div class="header">
        <h2>FrehAiIgs Local <span class="badge">Qwen 3B</span></h2>
        <div class="language-selector">
          <select id="language-select">
            <option value="en">🇬🇧 English</option>
            <option value="cs">🇨🇿 Čeština</option>
            <option value="sk">🇸🇰 Slovenčina</option>
          </select>
        </div>
      </div>

      <div id="chat-messages" class="messages"></div>
      
      <div class="input-wrap">
        <div id="image-previews" class="image-previews"></div>
        <div class="input-area">
          <button id="attach-btn" class="attach-btn" title="Attach image">＋</button>
          <textarea id="user-input" placeholder="Message FrehAiIgs..." rows="1"></textarea>
          <button id="stop-btn" class="stop-btn" style="display:none;">⏹</button>
          <button id="send-btn">→</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <input type="file" id="file-input" accept="image/*" multiple hidden>
  <script src="/static/script.js"></script>
</body>
</html>
